<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>High Command</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--panel:#1e2830;--panel2:#26323c;--line:#38464f;--text:#e6edf1;--muted:#93a4b0;--accent:#f2c94c;}
html,body{margin:0;height:100%;overflow:hidden;background:#cfdfe7;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--text);user-select:none}
#top{position:absolute;left:0;right:0;top:0;height:46px;background:var(--panel);display:flex;align-items:center;gap:20px;padding:0 14px;font-size:14px;border-bottom:1px solid var(--line);box-sizing:border-box;white-space:nowrap}
#title{font-weight:800;letter-spacing:.18em;font-size:15px;color:var(--accent)}
.stat b{font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
#speed button{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:4px 9px;margin-right:2px;border-radius:4px;cursor:pointer;font-size:13px}
#speed button.on{background:var(--accent);color:#222;border-color:var(--accent)}
#auto{background:var(--accent);color:#222;border:1px solid var(--accent);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:700}
#auto.off{background:var(--panel2);color:var(--muted);border-color:var(--line);font-weight:400}
#standings{display:flex;gap:8px;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:3px 9px;border-radius:12px;font-size:12px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
#game{position:absolute;left:0;top:46px;right:290px;bottom:0;cursor:crosshair}
canvas{display:block}
#side{position:absolute;top:46px;right:0;width:290px;bottom:0;background:var(--panel2);display:flex;flex-direction:column;border-left:1px solid var(--line)}
#sel{padding:12px 14px;overflow:auto;flex:1 1 auto;font-size:13px}
#logWrap{flex:0 0 34%;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#logWrap h3{margin:0;padding:8px 14px;font-size:11px;letter-spacing:.15em;color:var(--muted);font-weight:700}
#log{overflow:auto;padding:0 14px 10px;font-size:12px;line-height:1.45}
#log div{border-bottom:1px solid rgba(255,255,255,.05);padding:3px 0}
#log .t{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.ph{font-size:17px;font-weight:700;margin-bottom:2px}
.sub{color:var(--muted);margin-bottom:10px}
.sec{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:14px 0 6px;font-weight:700}
.bar{height:6px;background:#11181d;border-radius:3px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:#6fcf7f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bb{background:#33424d;color:var(--text);border:1px solid #45555f;border-radius:5px;padding:6px 7px;text-align:left;cursor:pointer;font-size:12px}
.bb:hover:not(:disabled){background:#3e4f5b;border-color:var(--accent)}
.bb:disabled{opacity:.4;cursor:default}
.bb b{display:block;font-size:12.5px}
.bb span{color:var(--muted);font-size:11px}
.q{display:flex;align-items:center;gap:8px;background:#1c252c;border-radius:4px;padding:4px 8px;margin-bottom:4px;cursor:pointer;font-size:12px}
.q:hover{outline:1px solid #b55}
.q .pb{flex:1;height:4px;background:#11181d;border-radius:2px;overflow:hidden}
.q .pb i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.act{background:#4a3434;border:1px solid #6b4545;color:var(--text);border-radius:5px;padding:6px 12px;cursor:pointer;margin-top:10px;margin-right:6px}
.act.nuke{display:block;width:100%;margin:0 0 10px;background:#7a1f1f;border-color:#b03a3a;font-weight:700;color:#ffe9a8}
.act:hover{background:#5d3f3f}
.tip{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
.tip kbd{background:#11181d;border:1px solid #3a4852;border-radius:3px;padding:0 4px;font-size:11px;color:var(--text)}
#overlay{position:absolute;inset:0;background:rgba(20,28,34,.72);display:flex;align-items:center;justify-content:center;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 30px;width:min(760px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h1{margin:0;letter-spacing:.25em;color:var(--accent);font-size:28px}
.card p{color:var(--muted);margin:6px 0 18px}
.nations{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nbtn{border:2px solid transparent;border-radius:8px;padding:12px 14px;cursor:pointer;background:#26323c;text-align:left;color:var(--text)}
.nbtn.on{border-color:var(--accent)}
.nbtn b{font-size:16px}
.nbtn div{font-size:12px;color:var(--muted);margin-top:4px}
.perk,.nbtn .perk{color:#8fd19e;font-size:12px;margin-top:4px}
.flaw,.nbtn .flaw{color:#ef9a9a;font-size:12px;margin-top:2px}
.diff{margin:16px 0;display:flex;gap:8px;align-items:center;font-size:13px}
.diff button{background:#26323c;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 12px;cursor:pointer}
.diff button.on{background:var(--accent);color:#222}
.go{background:var(--accent);color:#222;font-weight:800;letter-spacing:.15em;border:0;border-radius:6px;padding:11px 26px;cursor:pointer;font-size:14px}
.help{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px;columns:2}
.nbtn:disabled{opacity:.45;cursor:default}
.nbtn .tag{float:right;font-size:11px;font-weight:700;background:var(--accent);color:#222;border-radius:4px;padding:1px 6px}
.go:disabled{opacity:.45;cursor:default}
.mp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.mp .sec{margin-top:0}
.mp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mp button.ghost{background:#26323c;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 14px;cursor:pointer;font-size:13px}
.mp button.ghost:hover{border-color:var(--accent)}
.mp input{background:#11181d;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:7px 10px;font-size:14px;width:110px;letter-spacing:.2em;text-transform:uppercase}
.code{font-size:22px;font-weight:800;letter-spacing:.3em;color:var(--accent);background:#11181d;border-radius:6px;padding:4px 12px}
.mp .note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}
</style>

</head>

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// wiggly blob edge: radius multiplier at a given angle, fixed per feature
function blobR(e,a){const s=e.x*.37+e.y*.71;return 1+.16*Math.sin(3*a+s)+.09*Math.sin(5*a+s*1.7)+.05*Math.sin(9*a+s*2.3);}
function inBlob(x,y,e){const dx=(x-e.x)/e.rx,dy=(y-e.y)/e.ry;return Math.hypot(dx,dy)<=blobR(e,Math.atan2(dy,dx));}
function blobPts(e){const p=[];for(let k=0;k<72;k++){const a=k/72*Math.PI*2,r=blobR(e,a);p.push([e.x+Math.cos(a)*r*e.rx,e.y+Math.sin(a)*r*e.ry]);}return p;}

// a seed based on its endpoints, so a border shared by two nations wiggles identically for both of them.
// Wiggles are damped near cities so no town ends up in the sea, and map-edge lines stay straight.
function roughen(poly,amp=.2){const out=[];
 const nearCity=(x,y)=>CITY_DEFS.some(c=>Math.hypot(c.x-x,c.y-y)<85);
 const edge=(x,v)=>v===0||(x?v===W:v===H);
 function disp(P,Q,rng,acc){const dx=Q[0]-P[0],dy=Q[1]-P[1],L=Math.hypot(dx,dy);if(L<14)return;
  let o=(rng()*2-1)*L*amp;o=clamp(o,-45,45);const mx=(P[0]+Q[0])/2,my=(P[1]+Q[1])/2;if(nearCity(mx,my))o*=.12;
  const M=[mx-dy/L*o,my+dx/L*o];disp(P,M,rng,acc);acc.push(M);disp(M,Q,rng,acc);}
 for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];out.push(a);
  if((a[0]===b[0]&&(edge(1,a[0])))||(a[1]===b[1]&&edge(0,a[1])))continue;
  const fwd=a[0]<b[0]||(a[0]===b[0]&&a[1]<b[1]),P=fwd?a:b,Q=fwd?b:a;
  const rng=mulberry((Math.imul(P[0]*10|0,73856093)^Math.imul(P[1]*10|0,19349663)^Math.imul(Q[0]*10|0,83492791)^Math.imul(Q[1]*10|0,2654435))>>>0);

  out.push(...seg,Q);}return out;}

 if(mp==='host'&&(to==null||to===guestNation))send({t:'log',m:msg,c:col,d:dateStr(true)});}
function logFor(n,you,other,col){log(you,col,n);if(other)for(const h of humans)if(h!==n)log(other,col,h);}
function dateStr(short){const h=Math.floor(time),d=Math.floor(h/24)+1;return short?`D${d} ${String(h%24).padStart(2,'0')}h`:`Day ${d}, ${String(h%24).padStart(2,'0')}:00`;}

function orderMove(u,x,y,force){const p=astar(u.x,u.y,x,y,cfFor(u));if(!p)return false;u.path=p;u.order={type:'move',x,y,force:!!force};return true;}
function orderAttack(u,tg){u.order={type:'attack',target:tg};u.repath=0;if(UT[u.type].dom!=='air'){const p=astar(u.x,u.y,tg.x,tg.y,cfFor(u));u.path=p||[];}}
function aliveTgt(tg,n){return tg.isCity?true:targetable(tg,n);}
function domOf(tg){return tg.isCity?'land':UT[tg.type].dom;}
function tgtR(tg){return tg.isCity?12:UT[tg.type].dom==='sea'?10:7;}
function canHit(u,tg){const a=UT[u.type].atk[domOf(tg)];return a>0;}
function validTgt(u,tg){if(tg.isCity)return tg.owner!==u.nation&&tg.gar>0&&dist(u,tg)<=UT[u.type].rng+tgtR(tg)+4;
 return tg.nation!==u.nation&&targetable(tg,u.nation)&&dist(u,tg)<=UT[u.type].rng+tgtR(tg)+4;}
function findTarget(u){if(atPeace())return null;const t=UT[u.type];let best=null,bs=1e9;
 for(const e of units){if(e.nation===u.nation||!targetable(e,u.nation))continue;const ed=UT[e.type].dom;if(!t.atk[ed])continue;
  const d=dist(u,e);if(d>t.rng+tgtR(e))continue;const s=d-(ed===t.dom?1000:0)-(ed==='air'&&t.atk.air>=12?1500:0);if(s<bs){bs=s;best=e;}}
 if(!best&&t.atk.land>0)for(const c of cities){if(c.owner===u.nation||c.gar<=0)continue;if(dist(u,c)<=t.rng+tgtR(c)){best=c;break;}}
 return best;}
function inDefCity(u){for(const c of cities)if(c.owner===u.nation&&dist(u,c)<30)return true;return false;}
function terrAt(u){return gTerr[cellOf(u.x,u.y)];}
function fire(u,tg){if(atPeace())return;const t=UT[u.type];const dom=domOf(tg);let dmg=t.atk[dom];const d=dist(u,tg);
 if((u.type==='art'&&d<35)||(u.type==='rkt'&&d<40))dmg*=.5;
 if(u.type==='heli'&&tg.type==='tank')dmg*=1.5;
 if(u.type==='sub'){u.revealT=time+4;u.seen=ALL_SEEN;}// firing torpedoes gives the sub away
 if(u.type==='tank'&&ROUGH(terrAt(u)))dmg*=.65;
 if(u.nation===0&&isHuman(0)&&t.dom==='land'&&(terrAt(u)===2||terrAt(u)===3))dmg*=1.2;
 if(isGood(u.nation,u.type))dmg*=1.25;
 if(!tg.isCity&&dom==='land'){dmg*=TERR_DEF[terrAt(tg)][foot(tg.type)?0:1];if(inDefCity(tg))dmg*=.75;}
 dmg*=(.55+.45*u.hp/t.hp)*(.85+Math.random()*.3);
 damage(tg,dmg,u.nation,u.type);u.cd=.9+Math.random()*.2;
 if(u.type==='rkt'){u.cd=5+Math.random();// salvo: splashes everything around the target, then a long reload
  for(const e of units)if(e!==tg&&e.nation!==u.nation&&targetable(e,u.nation)&&UT[e.type].dom!=='air'&&dist(e,tg)<26)damage(e,dmg*.6,u.nation,u.type);
  for(let k=0;k<6;k++){const x=tg.x+rnd(18),y=tg.y+rnd(18);fx.push({k:'shot',x1:u.x+rnd(3),y1:u.y+rnd(3),x2:x,y2:y,t:.25,m:.25,c:'#ffb35c'},{k:'boom',x,y,t:.45,m:.45,r:9});}
  return;}
 fx.push({k:'shot',x1:u.x,y1:u.y,x2:tg.x+rnd(3),y2:tg.y+rnd(3),t:.14,m:.14,c:t.dom==='air'?'#fff3b0':u.type==='sub'?'#9fe0ff':'#ffcf6a'});}
function damage(tg,dmg,by,st){if(tg.isCity){if(st)recDealt(by,st,Math.min(dmg,tg.gar));tg.gar=Math.max(0,tg.gar-dmg);tg.lastHit=time;return;}if(isGood(tg.nation,tg.type))dmg*=.8;if(st)recDealt(by,st,Math.min(dmg,Math.max(0,tg.hp)));tg.hp-=dmg;if(tg.hp<=0&&!tg.dead)kill(tg,by);}
function recDealt(n,st,d){const m=nations[n].mem;m.dealt[st]=(m.dealt[st]||0)+d;}
function kill(u,by){u.dead=true;selection.delete(u);for(const c of u.cargo)kill(c);u.cargo=[];

function bombDrop(u,aim){if(atPeace())return;const t=UT[u.type];u.ammo--;u.cd=.9;fx.push({k:'boom',x:aim.x,y:aim.y,t:.5,m:.5,r:16});

  let dmg=t.atk[UT[e.type].dom]*(e===aim?1:.6);if(UT[e.type].dom==='land'&&inDefCity(e))dmg*=.8;damage(e,dmg,u.nation,u.type);}
 for(const c of cities)if(c.owner!==u.nation&&dist(c,aim)<30)damage(c,t.atk.land,u.nation,u.type);}
function nearestOwnCity(n,x,y){let b=null,bd=1e9;for(const c of cities)if(c.owner===n){const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;b=c;}}return b;}
function nearestEnemyAir(n,x,y,r,px,py,leash){let b=null,bd=r;for(const e of units){if(e.nation===n||e.dead||e.state==='landed'||UT[e.type].dom!=='air')continue;
 const d=Math.hypot(e.x-x,e.y-y);if(d>bd)continue;if(leash&&Math.hypot(e.x-px,e.y-py)>leash)continue;bd=d;b=e;}return b;}
function bomberAuto(u,px,py){let b=null,bd=90;for(const e of units){if(e.nation===u.nation||!targetable(e,u.nation)||UT[e.type].dom==='air')continue;const d=Math.hypot(e.x-px,e.y-py);if(d<bd){bd=d;b=e;}}
 if(b)return b;for(const c of cities)if(c.owner!==u.nation&&c.gar>0&&Math.hypot(c.x-px,c.y-py)<60)return c;return null;}
function airOrderValid(u){const o=u.order;if(!o)return false;if(o.type==='attack'){const tg=o.target;if(tg.isCity)return tg.owner!==u.nation;return targetable(tg,u.nation);}return true;}
function doUnload(tr){const x=tr.order&&tr.order.x,y=tr.order&&tr.order.y;tr.order=null;if(!tr.cargo.length)return;
 const lc=nearestPass(cellOf(tr.x,tr.y),tr.type==='trh'?CF.tank:CF.land,6);if(lc<0){if(isHuman(tr.nation))log(tr.type==='trh'?'Transport Helicopter can\'t set its Armor down there – pick open land.':'Transport too far from the coast to unload.',null,tr.nation);return;}
 for(const c of tr.cargo){c.inside=null;c.x=cellX(lc)+rnd(4);c.y=cellY(lc)+rnd(4);c.path=[];c.order=null;if(x!=null)orderMove(c,x+rnd(10),y+rnd(10));}
 tr.cargo=[];}

function updSurface(u,dt){const t=UT[u.type];
 if(u.jump){// paratroopers in the air: fly straight to the drop zone, then land on the nearest open ground
  const j=u.jump,d=Math.hypot(j.x-u.x,j.y-u.y),step=150*dt;u.ang=Math.atan2(j.y-u.y,j.x-u.x);
  if(d>step){u.x+=(j.x-u.x)/d*step;u.y+=(j.y-u.y)/d*step;return;}
  const c=nearestPass(cellOf(j.x,j.y),CF.land);if(c>=0){u.x=cellX(c);u.y=cellY(c);}else{u.x=j.x;u.y=j.y;}
  u.jump=null;u.path=[];u.order=null;fx.push({k:'mark',x:u.x,y:u.y,t:.6,m:.6,c:'#fff'});return;}
 const o=u.order;
 u.retgt-=dt;if(u.retgt<=0||(u.tgt&&!validTgt(u,u.tgt))){u.retgt=.35;u.tgt=t.rng?findTarget(u):null;}
 if(o&&o.type==='attack'){const tg=o.target;
  if(!aliveTgt(tg,u.nation)||(tg.isCity&&(tg.owner===u.nation))){u.order=null;u.path=[];}
  else if(dist(u,tg)<=t.rng+tgtR(tg)&&canHit(u,tg)){u.tgt=tg;u.path=[];}
  else{u.repath-=dt;if(u.repath<=0){u.repath=1.5;const p=astar(u.x,u.y,tg.x,tg.y,cfFor(u));if(p)u.path=p;}}}
 if(o&&o.type==='board'){const tr=o.target;
  if(tr.dead){u.order=null;u.path=[];}
  else if(dist(u,tr)<38&&tr.cargo.length<UT[tr.type].carry){u.inside=tr;tr.cargo.push(u);u.order=null;u.path=[];selection.delete(u);return;}
  else{u.repath-=dt;if(u.repath<=0){u.repath=2;const p=astar(u.x,u.y,tr.x,tr.y,cfFor(u));if(p)u.path=p;}}}
 let halt=false;
 if(u.tgt){if(u.cd<=0)fire(u,u.tgt);const td=domOf(u.tgt);
  if(!(o&&(o.force||o.type==='board'))&&(td===t.dom||u.tgt.isCity))halt=true;}
 // repairs
 if(!u.tgt){if(t.dom==='land'&&inDefCity(u))u.hp=Math.min(t.hp,u.hp+2*dt);
  if(t.dom==='sea'){for(const c of cities)if(c.owner===u.nation&&c.seaPt&&dist(u,c.seaPt)<50){u.hp=Math.min(t.hp,u.hp+3*dt);break;}}}
 for(const c of u.cargo){c.x=u.x;c.y=u.y;}
 if(halt)return;
 if(!u.path.length){if(o&&o.type==='move')u.order=null;else if(o&&o.type==='unload')doUnload(u);return;}
 const p=u.path[0],dx=p[0]-u.x,dy=p[1]-u.y,d=Math.hypot(dx,dy);let sp=t.spd;
 if(t.dom==='land'){const c=cfFor(u)(cellOf(u.x,u.y));sp/=(c===Infinity?1:c);}else if(gType[cellOf(u.x,u.y)]===1)sp*=.75;
 const step=sp*dt;u.ang=Math.atan2(dy,dx);
 if(u.wpP!==p){u.wpP=p;u.wpD=1e9;u.stall=0;}// new waypoint: reset the jam detector
 if(d<=step){u.x=p[0];u.y=p[1];u.path.shift();}
 else{u.x+=dx/d*step;u.y+=dy/d*step;
  // traffic jam: units crowding a shared waypoint (river crossings, roads) keep shoving each other off it.
  // If we make no headway for 1.5s, skip to the next waypoint (or call the trip done when nearly there).
  if(d<u.wpD-step*.25){u.wpD=d;u.stall=0;}else if((u.stall+=dt)>1.5){u.stall=0;u.wpD=1e9;if(u.path.length>1||d<30)u.path.shift();}}}
function updAir(u,dt){const t=UT[u.type];
 for(const c of u.cargo){c.x=u.x;c.y=u.y;}
 if(!baseOk(u))u.base=nearestOwnCity(u.nation,u.x,u.y);
 if(u.state==='landed'){if(!u.base){kill(u);return;}
  // refuel; at the take-off mark, top up and rearm in the same step, so a bomber can never leave with an
  // empty bomb bay (it used to rearm only at exactly 100% but take off at 99%, then circle home forever)
  u.fuel=Math.min(t.fuel,u.fuel+dt*t.fuel/6);if(u.fuel>=t.fuel*.99){u.fuel=t.fuel;u.ammo=t.ammo||0;u.hp=Math.min(t.hp,u.hp+dt*6);}
  if(u.fuel>=t.fuel*.99){if(u.order&&!airOrderValid(u))u.order=null;
   if(!u.order&&u.type==='ftr'){const e=nearestEnemyAir(u.nation,u.base.x,u.base.y,230*SC);if(e)u.order={type:'attack',target:e,auto:true};}
   if(u.order){u.state='fly';const g=u.order.type==='attack'?u.order.target:u.order;u.ang=Math.atan2(g.y-u.y,g.x-u.x);}}
  return;}
 u.fuel-=dt;if(u.fuel<=0){kill(u);if(isHuman(u.nation))log(`${t.name} ran out of fuel and crashed.`,'#e66',u.nation);return;}
 if(u.order&&!airOrderValid(u))u.order=(u.order.auto||u.type==='bmb')?null:{type:'move',x:u.x,y:u.y};
 const home=u.base;
 if(u.state!=='rtb'){const need=home?dist(u,home)/t.spd+1:0;if(!u.order||u.fuel<need||(u.type==='bmb'&&u.ammo<=0))u.state='rtb';}
 let gx,gy,aim=null;
 if(u.state==='rtb'){
  if(home){gx=home.x;gy=home.y;if(dist(u,home)<12){u.state='landed';if(u.order&&u.order.auto)u.order=null;return;}}
  else{gx=u.x+Math.cos(u.ang)*50;gy=u.y+Math.sin(u.ang)*50;}
  if(u.type==='ftr')aim=nearestEnemyAir(u.nation,u.x,u.y,t.rng);
 }else{const o=u.order;
  if(o.type==='attack'){aim=o.target;gx=aim.x;gy=aim.y;}
  else{aim=u.type==='ftr'?nearestEnemyAir(u.nation,u.x,u.y,170,o.x,o.y,280):u.type==='trh'?null:bomberAuto(u,o.x,o.y);
   if(aim&&u.type==='heli'&&!canHit(u,aim))aim=null;
   if(aim){gx=aim.x;gy=aim.y;}else if(hover(u.type)){gx=o.x;gy=o.y;}else{u.orb+=dt*t.spd/45;gx=o.x+Math.cos(u.orb)*45;gy=o.y+Math.sin(u.orb)*45;}}}
 if(aim&&u.cd<=0&&canHit(u,aim)&&dist(u,aim)<=t.rng+tgtR(aim)){if(u.type==='bmb'){if(u.ammo>0)bombDrop(u,aim);}else fire(u,aim);}
 if(hover(u.type)&&u.state!=='rtb'){// helicopters hover: stop once in firing range (or on the patrol spot)
  if(u.type==='trh'&&u.order&&u.order.type==='unload'&&Math.hypot(gx-u.x,gy-u.y)<8){doUnload(u);return;}// over the drop zone: set the Armor down
  const hold=aim?dist(u,aim)<=t.rng*.8:Math.hypot(gx-u.x,gy-u.y)<6;u.ang+=clamp(angDiff(Math.atan2(gy-u.y,gx-u.x),u.ang),-t.turn*dt,t.turn*dt);
  const dg=Math.hypot(gx-u.x,gy-u.y);if(hold||dg<.5)return;const st=Math.min(t.spd*dt,dg);u.x+=(gx-u.x)/dg*st;u.y+=(gy-u.y)/dg*st;return;}
 const dg=Math.hypot(gx-u.x,gy-u.y);let tr=t.turn*dt*(u.state==='rtb'&&dg<70?5:1);
 u.ang+=clamp(angDiff(Math.atan2(gy-u.y,gx-u.x),u.ang),-tr,tr);
 u.x=clamp(u.x+Math.cos(u.ang)*t.spd*dt,0,W);u.y=clamp(u.y+Math.sin(u.ang)*t.spd*dt,0,H);}
function separation(){const L=units.filter(u=>!u.dead&&!u.inside&&!u.jump&&UT[u.type].dom!=='air');
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];const da=UT[a.type].dom,db=UT[b.type].dom;if(da!==db)continue;
  const R=da==='sea'?16:11;const dx=b.x-a.x,dy=b.y-a.y;const d2=dx*dx+dy*dy;if(d2>=R*R)continue;const d=Math.sqrt(d2)||.01,push=(R-d)*.25,nx=dx/d,ny=dy/d;
  const cfa=cfFor(a),cfb=cfFor(b);
  if(cfa(cellOf(a.x-nx*push,a.y-ny*push))!==Infinity){a.x-=nx*push;a.y-=ny*push;}
  if(cfb(cellOf(b.x+nx*push,b.y+ny*push))!==Infinity){b.x+=nx*push;b.y+=ny*push;}}}
function updCities(dt){
 for(const c of cities){
  c.cd-=dt;
  if(c.cd<=0){c.cd=1;let best=null,bd=1e9;
   for(const e of units){if(e.nation===c.owner||!targetable(e,c.owner))continue;const dom=UT[e.type].dom;const r=dom==='air'?60:dom==='sea'?60:46;const d=dist(e,c);if(d<r&&d<bd){bd=d;best=e;}}
   if(best&&c.gar>0&&!atPeace()){damage(best,(UT[best.type].dom==='air'?9:8)*(.4+.6*c.gar/c.garMax),c.owner);fx.push({k:'shot',x1:c.x,y1:c.y,x2:best.x,y2:best.y,t:.12,m:.12,c:'#ffe9a8'});}}
  const hot=fallout.length&&inFallout(c.x,c.y,12);
  if(hot){c.capT=0;continue;}// irradiated: no one can live here – no regen, capture or production
  if(time-c.lastHit>6)c.gar=Math.min(c.garMax,c.gar+4*dt);
  if(c.gar<=0){let capN=-1,def=false;
   for(const e of units){if(e.dead||e.inside||e.jump||UT[e.type].dom!=='land')continue;const d=dist(e,c);
    if(e.nation===c.owner&&d<40)def=true;else if(e.nation!==c.owner&&UT[e.type].cap&&d<26&&capN<0)capN=e.nation;}
   if(capN>=0&&!def){if(c.capN!==capN){c.capN=capN;c.capT=0;}c.capT+=dt;if(c.capT>=3)captureCity(c,capN);}else{c.capT=Math.max(0,c.capT-dt);}}

  if(c.queue.length){const q=c.queue[0];q.t+=dt/buildMult(c.owner);if(q.t>=UT[q.type].time){c.queue.shift();
   if(q.type==='icbm'){const on=nations[c.owner];on.icbm=(on.icbm||0)+1;if(!testMode)log(`<b>ICBM ready</b> in the ${c.name} silo – press Launch in the side panel.`,'#f2c94c',c.owner);panelDirty=true;continue;}
   const u=spawnAt(q.type,c.owner,c);nations[c.owner].built++;
   if(u&&q.type==='trh')for(let k=0;k<UT.trh.carry&&!atLimit(c.owner,'tank');k++){const a=spawn('tank',c.owner,u.x,u.y);a.inside=u;u.cargo.push(a);}const bm=nations[c.owner].mem;bm.built[q.type]=(bm.built[q.type]||0)+1;
   if(u&&isHuman(c.owner)&&!testMode)log(`${UT[q.type].name} ready at ${c.name}${u.cargo.length?` with ${u.cargo.length} Armor aboard`:''}.`,'#7c9',c.owner);}}
 }}

function updFallout(dt){const before=fallout.length;fallout=fallout.filter(z=>z.until>time);

 if(!fallout.length)return;
 for(const u of units){if(u.dead||u.inside||u.state==='landed')continue;const z=fallout.find(z=>Math.hypot(u.x-z.x,u.y-z.y)<NUKE_R);if(z)damage(u,FALLOUT_DPS*dt,z.n);}}
// which nations can see each submarine (bit n of u.seen): its owner, anyone it just fired on, and anyone with a ship, helicopter or city close by
function updSeen(){for(const s of units){if(s.dead||s.type!=='sub')continue;if(s.revealT>time){s.seen=ALL_SEEN;continue;}let m=1<<s.nation;
 for(const e of units){if(e.dead||e.inside||e.nation===s.nation||(m>>e.nation)&1)continue;const r=SUB_SPOT[e.type]||(UT[e.type].dom==='sea'?SUB_SPOT.sea:0);if(r&&dist(e,s)<r)m|=1<<e.nation;}

function updSupply(dt){const done=new Set();for(const s of units){if(s.dead||s.inside||s.type!=='sup')continue;

function update(dt){

 for(const n of nations){if(!n.alive)continue;let inc=0;for(const c of cities)if(c.owner===n.id)inc+=cityIncome(c);n.income=inc*(isHuman(n.id)?1.15:diff.mult)*(n.blockade?.6:1);n.funds+=n.income*dt;}
 updSeen();
 for(const u of units){if(u.dead||u.inside)continue;u.cd-=dt;if(UT[u.type].dom==='air')updAir(u,dt);else updSurface(u,dt);}
 separation();updFallout(dt);updCities(dt);updSupply(dt);
 // landed plane layout: a ring round a city airfield, or lined up along a carrier's deck
 const slots=new Map();for(const u of units){if(u.dead||u.state!=='landed'||!u.base)continue;const b=u.base,k=slots.get(b)||0;slots.set(b,k+1);
  if(b.isCity){const a=-2.2+k*.75,r=20+Math.floor(k/8)*9;u.x=b.x+Math.cos(a)*r;u.y=b.y+Math.sin(a)*r;u.ang=-Math.PI/2;}
  else{const o=9-k*6;u.x=b.x+Math.cos(b.ang)*o;u.y=b.y+Math.sin(b.ang)*o;u.ang=b.ang;}}

 for(const f of fx)f.t-=dt;for(const f of fx)if(f.k==='icbm'&&f.t<=0)detonate(f);fx=fx.filter(f=>f.t>0);
 aiClock+=dt;if(aiClock>=.8){aiClock=0;for(const n of nations){if(!n.alive||isHuman(n.id))continue;if(((time/.8|0)+n.id)%3===0)aiThink(n);}
  for(const h of humans){const pn=nations[h];if(pn.auto&&pn.alive){const my=cities.filter(c=>c.owner===h);if(my.length)aiProduce(pn,my,units.filter(u=>u.nation===h&&!u.dead&&!u.inside));}}}

  if(atPeace()&&!testMode)borderCheck();

  const au=nations[1];if(au.alive){const b=isBlockaded(1);if(b!==au.blockade){au.blockade=b;if(isHuman(au.id))log(b?'Enemy warships are blockading our ports – income down 40%!':'The blockade is broken – imports flowing again.',b?'#e66':'#7c9',au.id);}}}}

// ================= AI =================
// The AI adapts within a game (counters the enemy units it sees, favours unit types that have
// performed well, remembers failed assaults) and learns across games (a saved profile of what
// the player tends to build, used to prepare counters before the player's army is even seen).
const BASE_MIX={inf:.27,para:.04,tank:.18,art:.1,rkt:.06,aa:.08,sup:.04,ftr:.09,heli:.06,bmb:.07,dd:.06,sub:.04,bb:.04,cv:.02,trh:.03};
const COUNTER={inf:{art:.4,tank:.4,rkt:.2},para:{tank:.5,inf:.5},tank:{art:.4,tank:.25,bmb:.15,heli:.2},art:{tank:.7,bmb:.3},rkt:{tank:.6,heli:.4},aa:{tank:.5,art:.5},sup:{tank:1},
 ftr:{ftr:.6,aa:.4},heli:{aa:.6,ftr:.4},bmb:{aa:.6,ftr:.4},dd:{bmb:.4,dd:.3,sub:.3},sub:{dd:.8,heli:.2},bb:{bmb:.4,bb:.2,sub:.4},cv:{sub:.5,bmb:.5},tr:{dd:.7,sub:.3},trh:{aa:.5,ftr:.5}};
function newMem(){return {dealt:{},lost:{},built:{},fails:{},waveAdd:0};}
const PKEY='highCommand.playerProfile';
function loadProfile(){try{const p=JSON.parse(localStorage.getItem(PKEY));if(p&&p.mix)return p;}catch(e){}return null;}
function saveProfile(){// blends this game's build mix into the profile loaded at game start, so repeat saves are safe
 if(testMode||mp||!started||!nations[player])return;const b=nations[player].mem.built;let tot=0;for(const k in b)tot+=b[k];if(tot<5)return;
 const old=profile?profile.mix:{},w=profile?.6:0,mix={};for(const k in UT)mix[k]=(old[k]||0)*w+(b[k]||0)/tot*(1-w);
 try{localStorage.setItem(PKEY,JSON.stringify({mix,games:(profile?profile.games:0)+1}));}catch(e){}}
function enemyMix(n,my){// cost-weighted share of each enemy unit type; units near our cities count double
 const mix={};let tot=0;
 for(const e of units){if(e.nation===n.id||e.dead)continue;let w=UT[e.type].cost;for(const c of my)if(dist(e,c)<500*SC){w*=2;break;}mix[e.type]=(mix[e.type]||0)+w;tot+=w;}
 for(const k in mix)mix[k]/=tot;
 const f=profile&&!testMode&&n.id!==player&&nations[player].alive?(tot?Math.max(0,.5-time/480):1):0;
 if(f)for(const k in UT)mix[k]=(mix[k]||0)*(1-f)+(profile.mix[k]||0)*f;
 return mix;}
function effFactor(m){// damage dealt per cost invested, relative to the average type; needs 3+ built to judge
 const v={};let s=0,k=0;for(const t in BASE_MIX){const b=m.built[t]||0;if(b<3)continue;v[t]=(m.dealt[t]||0)/(UT[t].cost*b);s+=v[t];k++;}
 const f={};for(const t in v)f[t]=s>0?clamp(Math.sqrt(v[t]/(s/k)),.6,1.6):1;return f;}
function landHPNear(n,x,y,r){let s=0;for(const e of units)if(e.nation!==n&&!e.dead&&!e.inside&&UT[e.type].dom==='land'&&Math.hypot(e.x-x,e.y-y)<r)s+=e.hp;return s;}
function pickTarget(n,my){let best=null,bs=1e9;for(const c of cities){if(c.owner===n.id)continue;let md=1e9;for(const m of my)md=Math.min(md,dist(m,c));
 const s=md+c.gar*.8+(nations[c.owner].capital===c?60:0)-(isHuman(c.owner)?diff.aggro:0)-(n.id===2&&c.id===LUMAFORD?80:0)
  +landHPNear(n.id,c.x,c.y,200*SC)*.15+(n.mem.fails[c.id]||0)*70;if(s<bs){bs=s;best=c;}}return best;}
function aiProduce(n,my,mine){const em=enemyMix(n,my),ef=effFactor(n.mem),dem={},want={};let wt=0;
 for(const k in BASE_MIX)dem[k]=0;for(const t in em)for(const k in COUNTER[t]||{})dem[k]+=em[t]*COUNTER[t][k];
 for(const k in BASE_MIX){want[k]=(BASE_MIX[k]+dem[k])*.5*(ef[k]||1);wt+=want[k];}for(const k in want)want[k]/=wt;
 const ftrCap=2+Math.round(dem.ftr*10),bmbCap=1+Math.round(dem.bmb*8);
 const cnt={};let tot=1;for(const k in want)cnt[k]=0;for(const u of mine)if(cnt[u.type]!=null){cnt[u.type]++;tot++;}
 for(const c of my)for(const q of c.queue)if(cnt[q.type]!=null){cnt[q.type]++;tot++;}
 for(const c of my.slice().sort(()=>Math.random()-.5)){if(c.queue.length||(farmTown(c)&&cnt.inf/tot>=.45))continue;let best=null,bv=-1e9;
  for(const k in want){if(!canBuild(c,k)||(k==='ftr'&&cnt.ftr>=ftrCap)||(k==='bmb'&&cnt.bmb>=bmbCap)||(k==='cv'&&cnt.cv>=1)||(k==='trh'&&cnt.trh>=2)||(k==='sup'&&cnt.sup>=3)||atLimit(n.id,k))continue;const v=want[k]-cnt[k]/tot+Math.random()*.05+(k==='trh'&&!cnt.trh&&cnt.tank>=2?.2:0);if(v>bv){bv=v;best=k;}}
  const cost=best&&costOf(n.id,best);if(best&&n.funds>=cost){n.funds-=cost;c.queue.push({type:best,t:0,cost});cnt[best]++;tot++;}}}
function aiThink(n){
 const my=cities.filter(c=>c.owner===n.id);if(!my.length)return;
 const mine=units.filter(u=>u.nation===n.id&&!u.dead&&!u.inside);
 aiProduce(n,my,mine);
 if(atPeace())return;
 const threats=[];
 for(const c of my){let s=0,near=null,nd=1e9;for(const e of units){if(e.nation===n.id||e.dead||e.inside||UT[e.type].dom==='air')continue;const d=dist(e,c);if(d<180*SC){s+=e.hp;if(d<nd){nd=d;near=e;}}}if(s>0)threats.push({c,s,near});}
 threats.sort((a,b)=>b.s-a.s);
 const m=n.mem;
 if(n.wave&&n.wave.owner===n.id){m.waveAdd=Math.max(0,m.waveAdd-1);m.fails[n.wave.id]=0;n.wave=null;}// assault succeeded
 if(!n.target||n.target.owner===n.id||time-n.targetT>90){n.target=pickTarget(n,my);n.targetT=time;}
 const tgt=n.target;const land=mine.filter(u=>UT[u.type].dom==='land');
 for(const u of land)if(u.role==='def'&&!threats.some(t=>t.c===u.defCity))u.role=null;
 for(const th of threats){let have=0;for(const u of land)if(u.role==='def'&&u.defCity===th.c)have+=u.hp;
  const cand=land.filter(u=>u.role!=='def'&&u.role!=='home').sort((a,b)=>dist(a,th.c)-dist(b,th.c));
  for(const u of cand){if(have>=th.s*1.2||dist(u,th.c)>420*SC)break;u.role='def';u.defCity=th.c;orderMove(u,th.c.x+rnd(15),th.c.y+rnd(15));have+=u.hp;}}
 if(n.capital&&!land.some(u=>u.role==='home')){const g=land.filter(u=>!u.role&&u.type==='inf').sort((a,b)=>dist(a,n.capital)-dist(b,n.capital))[0];if(g){g.role='home';orderMove(g,n.capital.x+rnd(10),n.capital.y+rnd(10));}}
 for(const u of land)if(u.role==='home'&&!u.order&&n.capital&&dist(u,n.capital)>30)orderMove(u,n.capital.x+rnd(10),n.capital.y+rnd(10));
 // badly damaged attackers fall back to the nearest friendly city to heal
 for(const u of land){const mx=UT[u.type].hp;
  if(u.role==='atk'&&u.hp<mx*.3){const c=nearestOwnCity(n.id,u.x,u.y);if(c){u.role='rest';orderMove(u,c.x+rnd(12),c.y+rnd(12));}}
  else if(u.role==='rest'){if(u.hp>=mx*.9)u.role=null;else if(!u.order){const c=nearestOwnCity(n.id,u.x,u.y);if(c&&dist(u,c)>30)orderMove(u,c.x+rnd(12),c.y+rnd(12));}}}
 let marching=0;
 if(tgt){const stage=my.slice().sort((a,b)=>dist(a,tgt)-dist(b,tgt))[0];
  const wave=Math.min(14,4+Math.floor(time/240)+m.waveAdd);
  for(const u of land)if(u.role==='atk'){marching++;if(u.tgtCity!==tgt||(!u.order&&dist(u,tgt)>40)){u.tgtCity=tgt;orderMove(u,tgt.x+rnd(18),tgt.y+rnd(18));}}
  if(marching)n.wave=tgt;
  else if(n.wave&&n.wave.owner!==n.id){// assault wiped out or driven off: remember it and come back stronger
   m.fails[n.wave.id]=(m.fails[n.wave.id]||0)+1;m.waveAdd=Math.min(6,m.waveAdd+2);
   if(isHuman(n.wave.owner))log(`${n.name}'s assault on ${n.wave.name} was repulsed – expect them back in greater strength.`,n.color,n.wave.owner);
   n.wave=null;n.targetT=-999;}
  const ready=land.filter(u=>!u.role&&dist(u,stage)<150*SC),rhp=ready.reduce((s,u)=>s+u.hp,0);
  const need=landHPNear(n.id,tgt.x,tgt.y,200*SC)+tgt.gar*.5;// don't march into a stronger army unless massively ready
  if((ready.length>=wave&&rhp>=need)||ready.length>=wave*2||(marching>=3&&ready.length)){for(const u of ready){u.role='atk';u.tgtCity=tgt;orderMove(u,tgt.x+rnd(18),tgt.y+rnd(18));marching++;}if(ready.length)n.wave=tgt;}
  else for(const u of land)if(!u.role&&!u.order&&dist(u,stage)>=150*SC)orderMove(u,stage.x+rnd(50),stage.y+rnd(50));
  // paratroopers waiting in a city drop in behind an assault that's already under way
  if(marching>=3)for(const u of land)if(u.type==='para'&&!u.jump&&u.role!=='def'&&u.role!=='home'&&inDefCity(u)){const d=dist(u,tgt);
   if(d>150&&d<JUMP_R){u.role='atk';u.tgtCity=tgt;const a=Math.random()*6.28;u.jump={x:tgt.x+Math.cos(a)*45,y:tgt.y+Math.sin(a)*45};}}}
 // navy
 for(const u of mine){const t=UT[u.type];if(t.dom!=='sea'||u.type==='tr')continue;
  if(u.order&&u.order.type==='attack'&&!aliveTgt(u.order.target,n.id))u.order=null;
  if(u.order&&u.order.type==='attack')continue;
  if(u.type==='cv'){// carriers stay back at the home port nearest the front, as a forward airbase
   const p=my.filter(c=>c.seaPt).sort((a,b)=>dist(a,tgt||a)-dist(b,tgt||b))[0];if(p&&!u.order&&dist(u,p.seaPt)>60)orderMove(u,p.seaPt.x+rnd(20),p.seaPt.y+rnd(20));continue;}
  let e=null,ed=(u.type==='dd'||u.type==='sub'?600:250)*SC;for(const x of units){if(x.nation===n.id||!targetable(x,n.id)||UT[x.type].dom!=='sea')continue;const d=dist(u,x);if(d<ed){ed=d;e=x;}}
  if(e){orderAttack(u,e);continue;}
  if(u.order)continue;
  let c=null,cd=1e9;for(const x of cities){if(x.owner===n.id||!x.seaPt||x.seaD>110)continue;const d=dist(u,x);if(d<cd){cd=d;c=x;}}
  if(c&&dist(u,c.seaPt)>40)orderMove(u,c.seaPt.x+rnd(10),c.seaPt.y+rnd(10));}
 // transport helicopters: idle or defending Armor near a parked one climbs aboard; once full, it flies them to our most threatened city, or in behind an assault already under way
 for(const u of land)if(u.role==='lift'&&!(u.order&&u.order.type==='board'))u.role=null;
 for(const h of mine){if(h.type!=='trh'||h.state!=='landed'||h.order)continue;const free=UT.trh.carry-h.cargo.length;
  if(free>0){const coming=land.filter(u=>u.role==='lift'&&u.order.target===h).length;
   const cand=land.filter(u=>u.type==='tank'&&(!u.role||u.role==='def')&&dist(u,h)<200*SC).sort((a,b)=>dist(a,h)-dist(b,h));
   for(const u of cand.slice(0,free-coming)){u.role='lift';u.order={type:'board',target:h};u.repath=0;}}
  else{const reach=UT.trh.fuel*UT.trh.spd*.4,th=threats.find(t=>dist(h,t.c)>120&&dist(h,t.c)<reach);
   if(th){h.order={type:'unload',x:th.c.x+rnd(20),y:th.c.y+rnd(20)};for(const c of h.cargo){c.role='def';c.defCity=th.c;}}
   else if(tgt&&marching>=3&&dist(h,tgt)<reach){const a=Math.atan2(h.y-tgt.y,h.x-tgt.x);
    h.order={type:'unload',x:tgt.x+Math.cos(a)*80,y:tgt.y+Math.sin(a)*80};for(const c of h.cargo){c.role='atk';c.tgtCity=tgt;}}}}
 // air
 const cvs=mine.filter(u=>u.type==='cv');
 for(const u of mine){const t=UT[u.type];if(t.dom!=='air'||u.type==='trh')continue;const reach=t.fuel*t.spd*.4;
  const deck=p=>cvs.find(c=>dist(c,p)<reach&&(c===u.base||hangarFree(c)));
  const ok=p=>{const b=nearestOwnCity(n.id,p.x,p.y);return (b&&dist(b,p)<reach)||!!deck(p);};
  if(u.state==='fly'&&u.order&&u.base&&u.base.isCity){const c=deck(u);if(c&&dist(c,u)<dist(u.base,u))u.base=c;}// land on a nearer carrier
  if(u.type==='ftr'){let p=threats.length?threats[0].c:(tgt&&marching>=2?tgt:n.capital);if(p&&!ok(p))p=n.capital;
   if(p&&(!u.order||u.order.auto||u.order.x!==p.x||u.order.y!==p.y))u.order={type:'move',x:p.x,y:p.y};}
  else{let tg=null;if(threats.length&&threats[0].near)tg=threats[0].near;else if(tgt&&tgt.gar>0)tg=tgt;
   if(tg&&ok(tg)){if(!u.order||u.order.target!==tg)u.order={type:'attack',target:tg};}else if(u.state==='landed')u.order=null;}}
}
// Every nation is at war with every other, humans included. When only one nation is left and it is human,
// the late nations rise one by one; beat the last of them to win. A human knocked out early can keep watching.
function checkEnd(){if(gameOver||testMode||!started)return;
 for(const h of humans)if(!nations[h].alive&&!lostShown.has(h)){lostShown.add(h);
  if(humans.some(o=>nations[o].alive)){log(`<b>${nations[h].name}'s commander has been defeated.</b>`,nations[h].color);
   if(h===player)showOut();else if(h===guestNation)send({t:'ev',k:'out'});}}
 const alive=nations.filter(n=>n.alive);
 if(!humans.some(h=>nations[h].alive))endGame(-1);
 else if(alive.length===1&&isHuman(alive[0].id)){const next=nations.find(n=>n.dormant);
  if(next){activateNation(next.id);setSpeed(0);showPhase(next);send({t:'ev',k:'phase',id:next.id});}else endGame(alive[0].id);}}
function endGame(w){gameOver=true;winner=w;setSpeed(0);showEnd(w===player);send({t:'ev',k:'end',w});}

 // gentle colour variation so the ground isn't flat

 {const v=document.createElement('canvas'),q=12;v.width=Math.ceil(W/q);v.height=Math.ceil(H/q);const vc=v.getContext('2d');

// The actual order logic. Runs on the host (or in solo) for nation `me`, whatever screen the click came from.
function issueOrders(me,sel,wx,wy,force,hu,hc){
 const groundSel=sel.filter(u=>UT[u.type].dom!=='air');
 const cols=Math.ceil(Math.sqrt(groundSel.length));let gi=0;
 for(const u of sel){const t=UT[u.type];if(u.jump)continue;
  if(u.type==='para'&&inDefCity(u)){const d=Math.hypot(wx-u.x,wy-u.y);// from one of our cities: jump instead of walking
   if(d>150&&d<=JUMP_R&&gType[cellOf(wx,wy)]===1){u.jump={x:wx+rnd(12),y:wy+rnd(12)};u.order=null;u.path=[];continue;}}
  if(hu&&hu.nation!==me&&canHit(u,hu)&&hu.state!=='landed'){orderAttack(u,hu);continue;}
  if(hu&&hu.nation===me&&canBoard(u,hu)){u.order={type:'board',target:hu};u.repath=0;continue;}
  if(t.dom==='air'){
   if(u.type==='trh'&&u.cargo.length&&gType[cellOf(wx,wy)]===1&&!(hu&&hu.nation===me)){u.order={type:'unload',x:wx,y:wy};if(u.state==='rtb'&&u.fuel>t.fuel*.5)u.state='fly';continue;}
   if(hu&&hu.nation===me&&hu.type==='cv'){if(u.base!==hu&&!hangarFree(hu)){log('That Carrier is full (4 aircraft).',null,me);continue;}
    u.base=hu;u.order=null;u.state='rtb';continue;}// take off (if parked) and fly straight to the carrier
   if(hc&&hc.owner===me&&!hu){u.base=hc;u.order=null;if(u.state==='fly')u.state='rtb';else if(u.state==='landed'){u.order={type:'move',x:hc.x,y:hc.y,auto:true};}continue;}
   if(hc&&hc.owner!==me&&u.type==='bmb'){u.order={type:'attack',target:hc};continue;}
   u.order={type:'move',x:wx,y:wy};if(u.state==='rtb'&&u.fuel>UT[u.type].fuel*.5)u.state='fly';continue;}
  const k=gi++,ox=((k%cols)-(cols-1)/2)*13,oy=(Math.floor(k/cols)-(cols-1)/2)*13;
  if(u.type==='tr'&&gType[cellOf(wx,wy)]===1&&!gRiver[cellOf(wx,wy)]){if(orderMove(u,wx,wy,true)){u.order={type:'unload',x:wx,y:wy};}continue;}
  // a plain click marches there without stopping (still shooting on the move); Ctrl+click is attack-move
  orderMove(u,wx+(groundSel.length>1?ox:0),wy+(groundSel.length>1?oy:0),!force);}}

function command(cmd){if(mp==='guest'){send({t:'cmd',...cmd});return;}runCmd(player,cmd);}
function runCmd(me,cmd){const n=nations[me];if(!n||!n.alive||gameOver)return;
 const mine=ids=>(ids||[]).map(id=>units.find(u=>u.id===id)).filter(u=>u&&!u.dead&&!u.inside&&u.nation===me);

 switch(cmd.c){
  case 'ord':{const sel=mine(cmd.ids);if(!sel.length)return;const hu=cmd.hu!=null?units.find(u=>u.id===cmd.hu&&!u.dead&&!u.inside)||null:null;
   issueOrders(me,sel,+cmd.x,+cmd.y,!!cmd.force,hu,cmd.hc!=null?city(cmd.hc)||null:null);break;}
  case 'stop':for(const u of mine(cmd.ids)){u.order=null;u.path=[];if(u.state==='fly')u.state='rtb';}break;
  case 'build':{const c=city(cmd.city),k=cmd.k;if(!c||c.owner!==me||!UT[k]||!canBuild(c,k)||n.limit[k]===0)return;const cost=costOf(me,k);

  case 'cancel':{const c=city(cmd.city);if(!c||c.owner!==me)return;const i=+cmd.i,it=c.queue[i];if(it){n.funds+=it.cost*(i===0?.5:1);c.queue.splice(i,1);}break;}

  case 'speed':if([0,1,2,4].includes(cmd.s))setSpeed(cmd.s);break;}

 for(const u of units)if(!byId.has(u.id)){u.dead=true;selection.delete(u);}
 units=next;
 fallout=m.F.map(a=>({x:a[0],y:a[1],n:a[2],until:a[3]}));
 fx=m.X.concat(fx.filter(f=>f.k==='mark'));}

// ================= MAIN LOOP =================
let last=performance.now(),acc=0,netClock=0;
function frame(now){const real=Math.min(.1,(now-last)/1000);last=now;
 if(mp==='host'&&started){netClock+=real;if(netClock>=.125){netClock=0;sendSnap();}}
 if(mp==='guest'&&started){const k=Math.min(1,real*12);// glide units toward the latest snapshot
  for(const u of units)if(u.tx!=null){u.x+=(u.tx-u.x)*k;u.y+=(u.ty-u.y)*k;}
  for(const f of fx)f.t-=f.k==='mark'?real:real*speed;fx=fx.filter(f=>f.t>0);}
 const pan=500/cam.z*real;if(keys['a']||keys['arrowleft'])cam.x-=pan;if(keys['d']||keys['arrowright'])cam.x+=pan;if(keys['w']||keys['arrowup'])cam.y-=pan;if(keys['s']||keys['arrowdown'])cam.y+=pan;
 if(keys['a']||keys['d']||keys['w']||keys['s']||keys['arrowleft']||keys['arrowright']||keys['arrowup']||keys['arrowdown'])clampCam();
 if(started&&!gameOver&&speed>0&&mp!=='guest'){acc+=real*speed;let n=0;while(acc>=.05&&n<20){update(.05);acc-=.05;n++;}if(n>=20)acc=0;}
 draw();panelClock+=real;if(started&&(panelDirty||panelClock>.4)){panelClock=0;renderPanel();renderTop();}
 requestAnimationFrame(frame);}

buildGrid();
window.addEventListener('resize',resize);
window.addEventListener("pagehide",saveProfile);
if(/[?&]test/.test(location.search)){
 // headless self-test: all four nations AI-controlled
 testMode=true;player=3;initState();started=true;resize();
 const out=[];const t0=performance.now();const steps=+(location.search.match(/steps=(\d+)/)||[0,12000])[1];
 for(let i=0;i<steps;i++){update(.05);if(i%2000===0)out.push(`t=${time.toFixed(0)}h units=${units.length} `+nations.map(n=>`${n.name}:${cities.filter(c=>c.owner===n.id).length}c/$${n.funds|0}`).join(' '));}
 out.push(`ms=${(performance.now()-t0)|0} errors=${JSON.stringify(window.__errors)}`);
 out.push('types: '+JSON.stringify(units.reduce((a,u)=>(a[u.type]=(a[u.type]||0)+1,a),{})));
 out.push('built: '+nations.map(n=>n.name+'='+n.built+'/lost='+n.lost).join(' '));
 document.getElementById('testout').textContent=out.join('\n');draw();
}else{
 nations=NATIONS.map(n=>({...n,alive:!n.late,dormant:!!n.late,funds:0,income:0}));cities=CITY_DEFS.filter(d=>!NATIONS[d.n].late).map((d,i)=>({id:i,name:d.name,x:d.x,y:d.y,owner:d.n,orig:d.n,port:!!d.port,gar:1,garMax:1,queue:[],region:null}));
 for(const c of cities){let p=NATIONS[c.orig].poly.slice();for(const d of cities)if(d!==c&&d.orig===c.orig)p=clipHalf(p,c,d);c.region=p;}
 for(const n of nations)n.capital=cities.find(c=>c.owner===n.id&&CITY_DEFS[c.id].cap);
 player=-1;resize();showStart();requestAnimationFrame(frame);
}
</script>
