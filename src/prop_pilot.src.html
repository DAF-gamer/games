<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Prop Pilot</title>
<style>

.pl:hover{background:#fff2cf}.pl.sel{background:#ffe9a8;box-shadow:3px 3px 0 var(--ink)}.pl.lock{opacity:.72}.pl.lock.afford{opacity:1;border-style:dashed}

.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.up{font:inherit;font-size:12px;line-height:1.35;color:var(--ink);background:#fffaf0;border:2px solid var(--ink);border-radius:6px;padding:6px;cursor:pointer}.up b{font-size:13px}.up.afford{border-style:dashed;background:#eaf7e4}.up.max{opacity:.7}@media (max-width:560px){.ups{grid-template-columns:1fr}}
#go{font:bold 18px Georgia,serif;color:var(--paper);background:#c62f2f;border:3px solid var(--ink);border-radius:6px;padding:10px 28px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}#go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#card details{margin-top:12px;text-align:left}#card summary{cursor:pointer;font-weight:bold;text-align:center}
@media (max-width:560px){.hgr{grid-template-columns:1fr}.pl{flex-direction:row;flex-wrap:wrap;align-items:center;text-align:left}.pl svg{width:90px;height:44px}.pl .ds{min-height:0;flex:1 1 60%}.st{flex:1 1 100%}.tag{flex:1 1 100%;text-align:center}}
#fire{position:fixed;right:max(14px,env(safe-area-inset-right));top:38%;transform:translateY(-50%);display:none;flex-direction:column;gap:12px}#fire button{width:78px;height:78px;border-radius:50%;background:#c62f2f;color:var(--paper);border:3px solid var(--ink);font:bold 13px Georgia,serif;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}#fire button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

#mob button.alt{background:rgba(43,33,24,.78)}#mob button.big{grid-column:span 3;width:100%;height:84px;border-radius:42px;font-size:22px}#mob button.on{filter:brightness(1.35);transform:translate(1px,1px)}

#stk i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#ffd54a;border:3px solid var(--ink);box-shadow:0 0 14px rgba(255,213,74,.9)}#stk::after{content:"STEER";position:absolute;left:0;right:0;top:-26px;text-align:center;font:bold 14px Georgia,serif;color:#fff6e0;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}#stk.on::after{display:none}
#mthr{position:fixed;right:calc(max(12px,env(safe-area-inset-right)) + 260px);bottom:max(10px,env(safe-area-inset-bottom));width:66px;height:min(62vh,280px);border:3px solid var(--ink);border-radius:33px;background:rgba(43,33,24,.6);box-shadow:3px 3px 0 var(--ink);overflow:hidden;touch-action:none;z-index:5}body.mob.fly #mthr{display:block}
#mthr b{position:absolute;left:0;right:0;bottom:0;background:rgba(255,213,74,.8)}#mthr span{position:absolute;left:0;right:0;top:10px;text-align:center;font:bold 15px Georgia,serif;color:var(--paper);text-shadow:1px 1px 0 var(--ink)}

</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><div id="card"></div></div>
<div id="fire"><button id="bg">GUN</button><button id="br">ROCKET</button><button id="bf">FLARE</button><button id="bb">AAM</button></div>
<div id="mob"><button data-k="r">ROCKET</button><button data-k="v">AAM</button><button data-k="x">FLARE</button><button data-k="t" class="alt">TARGET</button><button data-k="g" class="alt">WING</button><button data-k="b" class="alt">BRAKE</button><button data-k="f" class="big">GUN</button></div>

<script>
const cv=document.getElementById('c'),card=document.getElementById('card');let ctx=cv.getContext('2d');
let W,H,u,F,cx;
// ---- auto graphics quality: QL 0 High, 1 Medium, 2 Low, 3 Minimum (render scale + particle caps), stepped by autoQ() from measured FPS
var DPR=1,QL=0;const QR=[1,.8,.67,.5],QN=["HIGH","MED","LOW","MIN"],QP={tr:[700,450,280,160],bm:[160,110,70,45],sm:[4,3,2,1],pod:[2,2,3,4]};try{const q=+localStorage.getItem("ppQL");if(q>=0&&q<=3)QL=q|0}catch(e){}
// ---- mobile mode: ?mobile=1 / ?desktop=1 picks it (remembered in localStorage 'fsMode', shared with the home page),
// otherwise a touch-first device (coarse pointer) gets it. Phones start at Medium graphics unless a level was saved.
const MOB=(()=>{const q=new URLSearchParams(location.search);let m=q.has('mobile')?'m':q.has('desktop')?'d':null;try{if(m)localStorage.setItem('fsMode',m);else m=localStorage.getItem('fsMode')}catch(e){}return m?m=='m':matchMedia('(pointer:coarse)').matches})(),MS={id:null,x:0,y:0,ox:0,oy:0};
if(MOB){document.body.classList.add('mob');try{if(localStorage.getItem("ppQL")==null)QL=1}catch(e){QL=1}}
var AQ={t0:0,n:0,l:0,bad:0,good:0,hold:0,fails:[0,0,0,0]};
function setQ(q){QL=q;try{localStorage.setItem("ppQL",q)}catch(e){}rs()}
function autoQ(ts){const fd=ts-(AQ.l||ts);AQ.l=ts;if(state!=1||document.hidden||fd>250){AQ.t0=0;return}if(!AQ.t0){AQ.t0=ts;AQ.n=0;return}AQ.n++;const el=ts-AQ.t0;if(el<1500)return;const fps=AQ.n*1000/el;AQ.t0=ts;AQ.n=0;if(AQ.hold>0){AQ.hold--;return}
 if(fps<48){AQ.good=0;if(++AQ.bad>=2&&QL<3){AQ.fails[QL]++;AQ.bad=0;AQ.hold=2;setQ(QL+1)}}
 else{AQ.bad=0;if(fps>=57&&QL>0){if(++AQ.good>=8*(1+2*AQ.fails[QL-1])){AQ.good=0;AQ.hold=2;setQ(QL-1)}}else AQ.good=0}}
function tPush(p){if(QL>=2&&(++tPush.n&1))return;trail.push(p)}tPush.n=0;
function rs(){const d0=Math.min(devicePixelRatio||1,2),d=DPR=QL>=3?Math.min(d0,1.5):d0,g=Math.max(.6,d0*QR[QL]);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);u=Math.min(W/900,H/650);F=Math.max(W*.62,H*.95);cx=W/2;if(SKY0){SKY0.width=Math.round(W*g);SKY0.height=Math.round(H*g);sctx.setTransform(g,0,0,g,0,0)}if(GLT){GLT.c.width=Math.round(W*g);GLT.c.height=Math.round(H*g)}}
addEventListener('resize',rs);rs();
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hh=(i,j)=>{let h=(Math.imul(i|0,73856093)^Math.imul(j|0,19349663))>>>0;h^=h>>>13;h=Math.imul(h,0x5bd1e995)>>>0;h^=h>>>15;return h>>>0};
const river=z=>Math.sin(z/1500)*700+900,road=z=>-600+Math.sin(z/900)*300;
const FIELDS=[[108,174,79],[201,178,74],[79,154,69],[156,123,69],[122,184,90],[214,198,106]];
const SD=[[88,168,236],[196,232,252]],SS=[[74,84,158],[252,176,112]],POOL=[0,0,0,1,1,1,2,3,4,5,6,6,7,7,8,8];
let state=0,t=0,X,Z,alt,yaw,pitch,roll,speed,thr,stX,stY,spin=0,dist,hull,inv,flash,fcol,shake,best=0,msg='',msgT=0,birds=[],bT=4,keys={},mode=0,pp={x:0,y:0};
var onGround=true,airT=0,bonus=0,landed=false,bullets=[],rockets=[],booms=[],trail=[],ruins=[],dead={},rk=8,rkT=0,gT=0,gH=0,gOH=0,rT=0,gunBtn=0,rocBtn=0,tg=[],ebul=[],wave=1,mDone=false,hSpawn=false,fl=[],fc=4,fcT=0,fcd=0,dmgP=0;const wr=(v,m)=>((v+m)%(2*m)+2*m)%(2*m)-m;
const balls=Array.from({length:14},(_,i)=>{const h=hh(i,7);return{x:(h%12000)-6000,z:((h>>>8)%12000)-6000,y:150+(h>>>4)%350,k:i%4}});
var lpf=0;
// ---- planes + hangar (points are earned by clearing waves and saved in localStorage)
// base/th: airspeed at idle / extra at full throttle. vs: scales speed for handling curves. st: enemy detection range multiplier (stealth).
const PLANES=[
 {n:'Prop Pilot',d:'Trusty prop plane. Slow, but nimble and forgiving.',cost:0,jet:0,base:110,th:300,min:45,stall:150,to:130,acc:.08,climb:110,turn:1,pr:1,rl:1,vs:1,land:280,rk:8,hull:3,gun:.07,burn:1,st:1,col:'#f2c230'},
 {n:'F-16',d:'Fast jet fighter. More rockets and a tougher frame.',cost:2000,jet:1,base:140,th:380,min:80,stall:180,to:170,acc:.12,climb:85,turn:1.2,pr:1.15,rl:1.3,vs:.62,land:330,rk:12,hull:4,gun:.055,burn:1.25,st:1,col:'#9aa3ab'},
 {n:'F-22',d:'Stealth fighter. Enemies spot you later. Fastest and toughest.',cost:6000,jet:1,base:140,th:520,min:90,stall:180,to:180,acc:.14,climb:70,turn:1.35,pr:1.3,rl:1.5,vs:.5,land:350,rk:16,hull:5,gun:.045,burn:1.35,st:.7,col:'#6f777e'}];
const SAVE={pts:0,own:[1,0,0],sel:0};let runPts=0;
function svLoad(){try{const j=JSON.parse(localStorage.getItem('ppHangar')||'null');if(j)Object.assign(SAVE,j)}catch(e){}}
function svSave(){try{localStorage.setItem('ppHangar',JSON.stringify(SAVE))}catch(e){}}
const PL=()=>PLANES[SAVE.sel];
function earn(n){const before=SAVE.pts;SAVE.pts+=n;runPts+=n;svSave();
 const nw=PLANES.find((p,i)=>!SAVE.own[i]&&p.cost<=SAVE.pts&&p.cost>before);if(nw)setTimeout(()=>{if(state==1){msg='You can now buy the '+nw.n+'!';msgT=3;}},4300);return n}
const SIL=[c=>`<polygon points="47,8 53,8 54,50 46,50" fill="${c}"/><rect x="12" y="20" width="76" height="9" rx="3" fill="${c}"/><rect x="34" y="46" width="32" height="6" rx="2" fill="${c}"/><rect x="38" y="4" width="24" height="3" rx="1.5" fill="#2b2118"/><ellipse cx="50" cy="24" rx="3" ry="5" fill="#3d5a6c"/>`,
 c=>`<polygon points="50,2 54,14 55,52 45,52 46,14" fill="${c}"/><polygon points="46,24 14,42 14,46 46,40 54,40 86,46 86,42 54,24" fill="${c}"/><polygon points="46,46 32,56 46,54 54,54 68,56 54,46" fill="${c}"/><ellipse cx="50" cy="16" rx="2.6" ry="6" fill="#3d5a6c"/>`,
 c=>`<polygon points="50,2 55,16 57,52 43,52 45,16" fill="${c}"/><polygon points="45,20 12,44 18,48 45,46 55,46 82,48 88,44 55,20" fill="${c}"/><polygon points="44,46 34,58 46,56 54,56 66,58 56,46" fill="${c}"/><polygon points="44,38 41,50 44,50" fill="#4b5258"/><polygon points="56,38 59,50 56,50" fill="#4b5258"/><ellipse cx="50" cy="15" rx="2.6" ry="6" fill="#c9a43a"/>`];
const bar=(l,v)=>`<span>${l}</span><i><b style="width:${Math.round(cl(v,0,1)*100)}%"></b></i>`;
function hangarHTML(){return `<div class="wal">Hangar points: <b>${SAVE.pts.toLocaleString()}</b></div><div class="hgr">`+PLANES.map((p,i)=>{const own=SAVE.own[i],sel=SAVE.sel==i,af=!own&&SAVE.pts>=p.cost;
 return `<button class="pl${sel?' sel':''}${own?'':' lock'}${af?' afford':''}" data-pl="${i}"><svg viewBox="0 0 100 60" aria-hidden="true">${SIL[i](p.col)}</svg><div class="nm">${p.n}</div><div class="ds">${p.d}</div><div class="st">${bar('Speed',(p.base+p.th)/660)}${bar('Turn',p.turn/1.35)}${bar('Armor',p.hull/5)}${bar('Rockets',p.rk/16)}</div><div class="tag">${sel?'Selected':own?'Select':af?'Buy for '+p.cost.toLocaleString()+' pts':'&#128274; '+p.cost.toLocaleString()+' pts'}</div></button>`}).join('')+'</div>'+upHTML()}
card.addEventListener('click',e=>{if(state==1)return;const ub=e.target.closest('[data-up]');if(ub){const k=ub.dataset.up,lv=SAVE.up[k]|0,c=UPG[k].cost[lv];if(c!==undefined&&SAVE.pts>=c){SAVE.pts-=c;SAVE.up[k]=lv+1;svSave();};setCard();return}const b=e.target.closest('[data-pl]');
 if(b){const i=+b.dataset.pl,p=PLANES[i];if(SAVE.own[i])SAVE.sel=i;else if(SAVE.pts>=p.cost){SAVE.pts-=p.cost;SAVE.own[i]=1;SAVE.sel=i;}else{return}svSave();setCard();return}
 if(e.target.closest('#go'))start()});
svLoad();
function reset(){aam=MA();tg=[];selT=null;OC.clear();combo=1;comboT=0;bossKills=0;b2=null;wm=null;wmCD=0;wbul=[];gbL=[];radarDown=false;msgQ=[];BASE=null;chainQ=[];mTime=0;gunBtn=0;rocBtn=0;gH=0;gOH=0;lpf=0;bullets=[];rockets=[];booms=[];trail=[];ruins=[];dead={};rk=PL().rk;rkT=0;runPts=0;lkT=null;lkP=0;fl=[];fc=MF();fcT=0;fcd=0;dmgP=0;onGround=true;airT=0;bonus=0;landed=false;X=0;Z=-150;alt=14;yaw=0;pitch=0;roll=0;speed=0;thr=0;stX=0;stY=0;dist=0;hull=MX();inv=0;flash=0;shake=0;birds=[];bT=4;msg='';wave=1;newMission();spawnRadar()}
function setCard(){document.body.classList.toggle('fly',state==1);document.getElementById('fire').style.display=state==1?'flex':'none';card.parentElement.style.display=state==1?'none':'flex';
 if(state==0)card.innerHTML='<h1>Prop Pilot</h1>'+hangarHTML()+'<button id="go">Take off &#9654;</button><p style="font-size:13px;margin-top:10px">Clear waves of enemies to earn hangar points and unlock jets.'+(MOB?'':' Space also takes off.')+'</p>'+(MOB?'<p style="font-size:13px"><b>Phone controls:</b> hold your phone sideways. Drag with your left thumb to steer (drag down to climb). Slide the THR bar to throttle up. Hold GUN to shoot, hold BRAKE to stop on the runway.</p>':'')+'<p style="font-size:12px;margin:4px 0"><a href="?'+(MOB?'desktop':'mobile')+'=1">Switch to '+(MOB?'desktop':'phone')+' controls</a></p><details><summary>How to fly</summary><p>You start on the runway. Throttle up, roll down the strip, and pull back once you reach take-off speed (130 in the prop plane, faster in the jets). Your mission: hunt down tanks, trucks, AA guns, radar, fuel tanks, bunkers and helicopters to clear each wave. AA guns and helicopters shoot back.</p><p><b>Stick:</b> drag anywhere, or arrow keys. Pull back (down) to climb, and keep holding it to loop the loop!<br><b>Throttle:</b> W / S, or drag the lever on the left. <br><b>Fire:</b> F = machine gun, R = rocket. Keep a target in your sight until it locks (a box, then a circle) and your rockets will home in.<br>The left monitor zooms in on your target.<br><b>Targets:</b> T cycles targets nearest-first (cyan brackets; the lock and pod follow your pick, and pressing past the last one goes back to auto). A cyan LEAD ring shows where to aim guns at helicopters and fighters. The THREAT scope on the left of the dash shows who can shoot at you.<br><b>Flares:</b> X. <b>Wingmen:</b> G calls 2 friendly fighters that attack every enemy with their guns for 75 s, aircraft first, then ground targets. Once every 4 minutes. <b>AAM (air-to-air missile):</b> V. You carry 2. A green diamond marks the aircraft it will chase (the one nearest your nose, or your T pick). Just fire: it locks instantly, flies very fast, leads its target, mostly ignores flares and kills on a hit. Reload on the runway. They only reload when you land on the runway.<br><b>Brake:</b> B or Space. <b>FPS counter:</b> P shows or hides it.</p><p><b>Repair &amp; rearm:</b> land on the runway and stop. <b>Missions:</b> every wave has an enemy base. Its armor depot sends tank columns at your runway, and each one that gets through costs a hull point. While the base AA guns stand, rockets cannot lock onto anything inside the base. Fuel tanks blow up in chains. Bunkers can only be hurt while their doors are open (or by a fuel-tank chain blast). Every 2nd wave brings a boss (an armored train): kill 3 bosses and a friendly B-2 fleet flattens every ground target. Quick kills build a combo multiplier.</p></details>';
 if(state==2)card.innerHTML=`<h1>Mission over</h1><p>You cleared <b>${wave-1}</b> wave${wave==2?'':'s'} and scored <b>${score()}</b>. Best: <b>${best}</b>.</p><p>Hangar points earned this flight: <b>+${runPts.toLocaleString()}</b></p>`+hangarHTML()+'<button id="go">Fly again &#9654;</button>'}
const score=()=>Math.round(dist/40+bonus);
function start(){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();reset();state=1;setCard()}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if((e.key==' '||e.key=='Enter')&&state!=1)start();if(e.key.toLowerCase()=='x'&&state==1)dropFlares();if(e.key.toLowerCase()=='g'&&state==1&&!e.repeat)callWM();if(e.key.toLowerCase()=="t"&&state==1&&!e.repeat)cycleT();if(e.key.toLowerCase()=="v"&&state==1&&!e.repeat)fireAAM();if(e.key.toLowerCase()=="p"&&!e.repeat)FPS.on^=1;if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{if(state!=1)start();if(MOB){mobDown(e);return}pp.x=e.clientX;pp.y=e.clientY;mode=(pp.x<cx-300*u&&pp.y>H*.5)?2:1});
cv.addEventListener('pointermove',e=>{pp.x=e.clientX;pp.y=e.clientY});
addEventListener('pointerup',()=>mode=0);
function hurt(f){if(f){if(t-(hurt.c||-9)<1)return;hurt.c=t}else if(inv>0)return;hull--;inv=1.6;shake=.5;flash=.5;fcol='255,40,30';if(hull<=0){state=2;best=Math.max(best,score());setCard()}}
const HT=[60,80,60,90,120,50],WD=[20,14,45,14,8,35];
