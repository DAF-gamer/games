<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop Pilot</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#2b2118;--paper:#fff6e0}
html,body{height:100%;margin:0;background:#8cc4ee;overflow:hidden;touch-action:none;font-family:Georgia,"Times New Roman",serif}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:20px 28px;max-width:420px;text-align:center;box-shadow:6px 6px 0 var(--ink);margin:16px}
#card h1{margin:0 0 6px;font-size:38px}#card p{margin:6px 0;line-height:1.45;font-size:16px}#card b{font-size:17px}
#card{pointer-events:auto;max-width:600px;max-height:calc(100vh - 40px);overflow-y:auto;box-sizing:border-box}
.wal{display:inline-block;margin:2px 0 10px;padding:4px 12px;border:2px solid var(--ink);border-radius:20px;background:#ffe9a8;font-size:15px}
.hgr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
.pl{font:inherit;color:var(--ink);background:#fffaf0;border:2px solid var(--ink);border-radius:6px;padding:8px 8px 10px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0}
.pl:hover{background:#fff2cf}.pl.sel{background:#ffe9a8;box-shadow:3px 3px 0 var(--ink)}.pl.lock{opacity:.72}.pl.lock.afford{opacity:1;border-style:dashed}
.pl svg{width:100%;height:56px}.pl .nm{font-weight:bold;font-size:15px}.pl .ds{font-size:12px;line-height:1.3;min-height:31px}
.st{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;font-size:11px;text-align:left}.st i{display:block;height:6px;border-radius:3px;background:#e0d4b8}.st i b{display:block;height:100%;border-radius:3px;background:#c62f2f}
.tag{margin-top:2px;font-size:13px;font-weight:bold;padding:3px 0;border-radius:4px}.sel .tag{background:var(--ink);color:var(--paper)}.lock .tag{background:#e0d4b8}.afford .tag{background:#2f8a3a;color:#fff}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.up{font:inherit;font-size:12px;line-height:1.35;color:var(--ink);background:#fffaf0;border:2px solid var(--ink);border-radius:6px;padding:6px;cursor:pointer}.up b{font-size:13px}.up.afford{border-style:dashed;background:#eaf7e4}.up.max{opacity:.7}@media (max-width:560px){.ups{grid-template-columns:1fr}}
#go{font:bold 18px Georgia,serif;color:var(--paper);background:#c62f2f;border:3px solid var(--ink);border-radius:6px;padding:10px 28px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}#go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#card details{margin-top:12px;text-align:left}#card summary{cursor:pointer;font-weight:bold;text-align:center}
@media (max-width:560px){.hgr{grid-template-columns:1fr}.pl{flex-direction:row;flex-wrap:wrap;align-items:center;text-align:left}.pl svg{width:90px;height:44px}.pl .ds{min-height:0;flex:1 1 60%}.st{flex:1 1 100%}.tag{flex:1 1 100%;text-align:center}}
#fire{position:fixed;right:max(14px,env(safe-area-inset-right));top:38%;transform:translateY(-50%);display:none;flex-direction:column;gap:12px}#fire button{width:78px;height:78px;border-radius:50%;background:#c62f2f;color:var(--paper);border:3px solid var(--ink);font:bold 13px Georgia,serif;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}#fire button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><div id="card"></div></div>
<div id="fire"><button id="bg">GUN</button><button id="br">ROCKET</button><button id="bf">FLARE</button><button id="bb">AAM</button></div>
